<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<script src="https://cdn.tailwindcss.com"></script>

<script>
if(localStorage.getItem("theme")==="dark"){
document.documentElement.classList.add("dark");
}
</script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center h-screen">

<button onclick="toggleTheme()"
class="absolute top-5 right-5 bg-gray-200 dark:bg-gray-700 px-3 py-1 rounded">
🌙
</button>

<div id="toast" class="hidden fixed top-5 right-5 px-4 py-2 rounded text-white shadow"></div>

<div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow w-96">

<h2 class="text-2xl font-bold mb-6 text-center text-gray-800 dark:text-white">
🟢 Register
</h2>

<input id="u" class="w-full p-2 border rounded mb-3 dark:bg-gray-700 dark:text-white" placeholder="Username">
<input id="p" type="password" class="w-full p-2 border rounded mb-4 dark:bg-gray-700 dark:text-white" placeholder="Password">

<button id="btn" onclick="register()" class="w-full bg-green-500 text-white p-2 rounded">
Register
</button>

<p class="text-center mt-4 text-sm text-gray-600 dark:text-gray-300">
Already have account?
<a href="/login" class="text-blue-500">Login</a>
</p>

</div>

<script>

function toggleTheme(){
const html=document.documentElement;
html.classList.toggle("dark");
localStorage.setItem("theme",
html.classList.contains("dark")?"dark":"light");
}

function toast(msg,type="success"){
const t=document.getElementById("toast");
t.innerText=msg;
t.className="fixed top-5 right-5 px-4 py-2 rounded text-white shadow";
t.classList.add(type==="error"?"bg-red-500":"bg-green-500");
t.classList.remove("hidden");
setTimeout(()=>t.classList.add("hidden"),3000);
}

async function register(){

if(!u.value.trim() || !p.value.trim()){
return toast("Fill all fields","error");
}

if(p.value.length<4){
return toast("Password min 4 chars","error");
}

btn.disabled=true;
btn.innerText="Registering...";

await fetch("/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({
username:u.value,
password:p.value
})
});

toast("Account created 🎉");
setTimeout(()=>window.location="/login",1200);
}

</script>

</body>
</html>
